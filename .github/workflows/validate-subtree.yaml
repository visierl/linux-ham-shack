name: Validate Subtree Integrity

on:
  pull_request:
    paths:
      - 'subtrees/**'

jobs:
  check-subtrees:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify all subtree changes came from git subtree
        run: |
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          HEAD_SHA="${{ github.event.pull_request.head.sha }}"
          FAILED=0

          echo "Inspecting PR commits from $BASE_SHA to $HEAD_SHA..."

          SUBTREE_DIRS=$(
            {
              git ls-tree -d --name-only "$BASE_SHA" subtrees/ 2>/dev/null || true
              git ls-tree -d --name-only "$HEAD_SHA" subtrees/ 2>/dev/null || true
            } | sort -u
          )

          if [ -z "$SUBTREE_DIRS" ]; then
            echo "No subdirectories found under 'subtrees/'."
            exit 0
          fi

          for SUBTREE_PREFIX in $SUBTREE_DIRS; do
            echo "----------------------------------------"
            echo "Checking subtree: $SUBTREE_PREFIX"

            TOUCHED_COMMITS=$(git log --no-merges --format="%H" "$BASE_SHA..$HEAD_SHA" -- "$SUBTREE_PREFIX")

            if [ -z "$TOUCHED_COMMITS" ]; then
              echo "No commits modified '$SUBTREE_PREFIX'."
              continue
            fi

            for COMMIT in $TOUCHED_COMMITS; do
              MSG=$(git log -1 --format="%B" "$COMMIT")

              if ! echo "$MSG" | grep -Fqx "git-subtree-dir: $SUBTREE_PREFIX"; then
                echo "ERROR: Commit $COMMIT modified '$SUBTREE_PREFIX' without a valid 'git subtree add/pull'."
                echo "   Expected trailer: 'git-subtree-dir: $SUBTREE_PREFIX'"
                echo "   Commit subject: $(git log -1 --format='%s' "$COMMIT")"
                FAILED=1
              else
                echo "Commit $COMMIT is a valid subtree update for '$SUBTREE_PREFIX'."
              fi
            done
          done

          if [ "$FAILED" -ne 0 ]; then
            echo "----------------------------------------"
            echo "Subtree validation failed."
            exit 1
          fi

          echo "----------------------------------------"
          echo "All subtree checks passed!"
