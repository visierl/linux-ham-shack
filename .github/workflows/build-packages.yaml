name: Build Packages

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:

jobs:
  build-deb:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y devscripts debhelper equivs
          sudo mk-build-deps -i -r -t "apt-get -y" packaging/debian/control
      - name: Build .deb
        run: |
          cp -a packaging/debian ./debian
          dpkg-buildpackage -us -uc -b
      - name: Upload .deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-ham-shack-deb
          path: ../linux-ham-shack_*.deb

  build-rpm:
    runs-on: ubuntu-24.04
    container:
      image: fedora:latest
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          dnf install -y rpm-build rpmdevtools dnf-plugins-core
          dnf builddep -y packaging/rpm/linux-ham-shack.spec
      - name: Build .rpm
        run: |
          rpmbuild -bb --define "_topdir $(pwd)/rpmbuild" \
                       --define "_sourcedir $(pwd)" \
                       --build-in-place \
                       packaging/rpm/linux-ham-shack.spec
      - name: Upload .rpm artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-ham-shack-rpm
          path: rpmbuild/RPMS/*/*.rpm
