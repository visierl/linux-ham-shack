# ~/.config/pipewire/pipewire.conf.d/99-ham-virtual-sinks.conf
# Creates persistent virtual audio cables for SDR TX/RX and Carla mic processing

context.modules = [
    # 1. Processed Mic Bus: Carla outputs processed mic audio here; Quisk reads from its .monitor
    {   name = libpipewire-module-null-sink
        args = {
            node.name        = "ham_mic_processed"
            node.description = "Ham Mic Processed (Carla -> Quisk TX)"
            media.class      = "Audio/Sink"
            audio.channels   = 2
            audio.position   = [ FL FR ]
            audio.rate       = 48000
        }
    }

    # 2. Radio RX Audio Bus: Quisk outputs demodulated RX audio here; WSJT-X/fldigi/speakers read from .monitor
    {   name = libpipewire-module-null-sink
        args = {
            node.name        = "ham_radio_rx"
            node.description = "Ham Radio RX Audio (Quisk -> Digital/Monitor)"
            media.class      = "Audio/Sink"
            audio.channels   = 2
            audio.position   = [ FL FR ]
            audio.rate       = 48000
        }
    }

    # 3. Digital Mode TX Bus: WSJT-X/fldigi outputs TX tones here; Quisk reads from its .monitor
    {   name = libpipewire-module-null-sink
        args = {
            node.name        = "ham_digital_tx"
            node.description = "Ham Digital TX Audio (WSJT-X -> Quisk TX)"
            media.class      = "Audio/Sink"
            audio.channels   = 2
            audio.position   = [ FL FR ]
            audio.rate       = 48000
        }
    }
]
