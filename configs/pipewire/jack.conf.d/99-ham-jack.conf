# ~/.config/pipewire/jack.conf.d/99-ham-jack.conf
# Configures pw-jack (used by Carla) to follow the default PulseAudio/PipeWire
# microphone dynamically and match the 48 kHz station sample rate.

jack.properties = {
    node.latency       = 1024/48000
    node.rate          = 1/48000
    jack.default-as-system = true
    jack.lock-volumes  = true
}
